# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#

# DEV
# rails console
#
# TEST
# rails console -e test
#
# PROD
# rails console -e production (тут будет ошибка что пароль не получен, так и нужно)
# $env:PRODUCTION_DATABASE_PASSWORD="password"; rails console -e production
# 
# Проверка на активность подключения у БД
# ActiveRecord::Base.connection.execute("SELECT 1")
# ActiveRecord::Base.connection.active?
# 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


default: &default
  adapter: postgresql
  encoding: UTF8
  host: localhost
  timeout: 5000
  reaping_frequency: 30
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: rails_user
  password: password

development:
  <<: *default
  database: api_rails_pg_development

test:
  <<: *default
  database: api_rails_pg_test

production:
  <<: *default
  database: api_rails_pg_production
  password: <%= ENV['PRODUCTION_DATABASE_PASSWORD'] %>